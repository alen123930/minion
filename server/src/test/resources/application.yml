# M0-3：集成测试直连 Testcontainers（Flyway API + JdbcTemplate），不经 Spring 上下文。
# 上下文接库（@ServiceConnection）在 M0-4 CRUD 任务落地。此处排除自动配置，
# 否则 classpath 上的 jdbc/flyway starter 会让无 DB 的 contextLoads 失败。
#
# 注意：test-classpath 上的 application.yml 会遮蔽 main application.yml，
# 故 MyBatis 与 Jackson 契约设置必须在测试侧复刻，否则集成测试拿不到
# mapper XML 与 snake_case 输出。集成测试全部走 `it` profile（application-it.yml
# 把 autoconfigure.exclude 覆盖为空），因此这里的排除项实际不生效。
#
# M0-5：内嵌 worker 默认关闭——各测试自建容器与任务，常驻轮询会抢跑；
# EmbeddedDaemonStarterIntegrationTest 用 @TestPropertySource 单独开启。
spring:
  application:
    name: legion-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:mapper/*.xml

legion:
  daemon:
    embedded:
      enabled: false