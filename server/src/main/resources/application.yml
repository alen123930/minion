spring:
  application:
    name: legion-server
  datasource:
    # 与 docker-compose.yml 默认凭据一致（可用标准 SPRING_DATASOURCE_* 环境变量覆盖）；
    # compose 仅绑定 127.0.0.1，开发库不得经局域网 IP 直连（NIMI-5）。
    url: jdbc:postgresql://127.0.0.1:5432/legion
    username: legion
    password: legion
  flyway:
    locations: classpath:db/migration
  jackson:
    # 契约字段统一 snake_case（DTO 为 camelCase record，输出经此策略转换，设计 §4.2）
    property-naming-strategy: SNAKE_CASE

mybatis:
  # MyBatis XML mapper 位置（mapUnderscoreToCamelCase 与 TypeHandler 在 MybatisConfig 统一注册，设计 §4.8）
  mapper-locations: classpath:mapper/*.xml